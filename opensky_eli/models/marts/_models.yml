version: 2

models:
  - name: fact_aircraft_incremental
    description: "Modelo incremental que procesa las nuevas aeronaves detectadas en S3"
    config:
      tags: ['incremental']
    columns:
      - name: icao24
        description: "ID único de la aeronave"
        tests:
          - unique
          - not_null
      - name: registration
      - name: aws_load_date

  - name: dim_operators_incremental
    columns: 
      - name: operator_icao
        tests:
          - unique:
              name: test_no_duplicate_operators
          - not_null

  - name: fact_operator_stats_incremental
    columns:
      - name: operator_icao
        tests:
          - unique
      - name: total_aircrafts
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
            
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true